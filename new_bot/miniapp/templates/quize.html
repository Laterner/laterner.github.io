{% extends "base.html" %}
{% block content %}
<style>
    body {
        justify-content: baseline;
        text-align: left;
    }

    .user {
        color: white;
    }

    .container {
        text-align: left;
    }
</style>
<div class="container">
    <h1>
        Вопрос 1:
    </h1>
    <button class="btn" onclick="answer(0)">ответ 1</button>
    <button class="btn" onclick="answer(1)">ответ 2</button>
    <button class="btn" onclick="answer(0)">ответ 3</button>
    <button class="btn" onclick="answer(0)">ответ 4</button>
</div>
<script>
    async function answer(ans) {
        if (ans == 1) {
            alert("Ответ правильный!")

            let response = await fetch('/answer?ans=1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json;charset=utf-8'
                }
            });

            let result = await response.json();
            console.log(result);

        }
        else {
            alert("Ответ неверный!")
        }
    }
</script>
{% endblock %}
