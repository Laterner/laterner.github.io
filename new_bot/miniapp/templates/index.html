{% extends "base.html" %}
{% block content %}
<style>
    body{
        justify-content: baseline;
        text-align: left;
    }
    .user{
        color: white;
    }
    .container {
        text-align: left;
    }
</style>
<div class="container">
    <div class="user">
        <p> Имя: {{user.name}} </p>
        <p> ID: {{user.player_id}} </p>
        <p> Команда: {{user.team}} </p>
        <p> Счёт: {{user.score}} </p>
        <p> Игр сыграно: {{user.games_played}} </p>
    </div>
</div>
    
{% endblock %}
