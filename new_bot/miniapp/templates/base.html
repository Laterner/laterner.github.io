<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0b0e14;
        min-height: 100vh;
    }
    .container {
        background: #1a1f2b;
        border-radius: 28px;
        padding: 30px;
        max-width: 640px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
    }

    h1 {
        color: #f0f3fa;
        font-weight: 500;
        font-size: 1.8rem;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }

    .btn {
            background: #2f3748;
            border: none;
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            color: #e8ecf5;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn:hover {
            background: #3d465b;
            transform: scale(1.02);
        }
        .btn-primary {
            background: #4a6cf7;
            color: white;
        }
        .btn-primary:hover {
            background: #5f7df9;
        }
        .btn-danger {
            background: #c73b4b;
        }
        .btn-danger:hover {
            background: #d94b5c;
        }

        @media (max-width: 480px) {
            .container { padding: 18px; }
            .btn { padding: 12px 18px; font-size: 0.9rem; }
        }

    @import url('https://fonts.googleapis.com/css?family=Ubuntu+Condensed');

    footer {
        width: 100%;
    }

    .menu {
        width: 100%;
        display: table;
        margin-top: 30px;
        position: absolute;
        bottom: 0;
        left:0;
    }

    .menu ul {
        display: table-row;
    }

    .menu li {
        display: table-cell;
        background: #2767A0;
    }

    /* .menu li:first-child {
        border-top-left-radius: 80px 80px;
        border-bottom-left-radius: 80px 80px;
    }

    .menu li:last-child {
        border-top-right-radius: 80px 80px;
        border-bottom-right-radius: 80px 80px;
    } */

    .menu ul li:hover,
    .menu a:hover {
        background: #666;
    }

    .menu li a {
        display: block;
        padding: 8px 15px;
        color: #fff;
        text-align: center;
    }

    @media (max-width: 550px) {
        .menu-main {
            padding-top: 0;
        }

        .menu-main li {
            display: block;
        }

        .menu-main li:after {
            content: none;
        }

        .menu-main a {
            padding: 25px 0 20px;
            margin: 0 30px;
        }
    }
</style>

<body>
    {% block content %} {% endblock %}
</body>

<footer>
    <div class="menu">
        <ul>
            <li><a href="/">Главная</a></li>
            <li><a href="/map">Карта</a></li>
            <li><a href="/qr">QR</a></li>
            <li><a href="/faq">FAQ</a></li>
        </ul>
    </div>
</footer>

</html>
