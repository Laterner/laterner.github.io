<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Авторизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            color: white;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .user-info {
            background: #f5f6fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        
        .user-info .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .user-info .value {
            color: #333;
            font-size: 16px;
            font-weight: 500;
            margin-top: 4px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            min-height: 24px;
        }
        
        .status.success {
            color: #27ae60;
        }
        
        .status.error {
            color: #e74c3c;
        }
        
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loader.active {
            display: inline-block;
        }

        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 12px;
            text-align: left;
            color: #666;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .debug-info pre {
            margin: 5px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar" id="avatar">👤</div>
        
        <h1>Добро пожаловать!</h1>
        <p class="subtitle">Войдите в свой аккаунт</p>
        
        <div id="userInfo" class="user-info" style="display: none;">
            <div class="label">Telegram ID</div>
            <div class="value" id="tgIdDisplay">-</div>
        </div>
        
        <button id="authBtn" class="btn" onclick="authorize()" disabled>
            Загрузка...
        </button>
        
        <div id="status" class="status"></div>
        <div id="loader" class="loader"></div>

        <button class="btn" onclick="delete_coockies()">Удалить куки</button>
        
        <!-- Отладка -->
        <div id="debugInfo" class="debug-info">
            <strong>Отладочная информация:</strong>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let tgUser = null;
        let tgId = null;
        let isTelegramWebApp = false;
        let webapp = null;

        // Функция для отладки
        function debugLog(message, data = null) {
            const debugDiv = document.getElementById('debugInfo');
            const debugContent = document.getElementById('debugContent');
            
            debugDiv.classList.add('show');
            const timestamp = new Date().toLocaleTimeString();
            let logMessage = `[${timestamp}] ${message}`;
            if (data) {
                logMessage += `\nДанные: ${JSON.stringify(data, null, 2)}`;
            }
            debugContent.textContent += logMessage + '\n---\n';
            console.log(logMessage);
        }

        // Основная функция инициализации
        function initTelegramApp() {
            debugLog('Инициализация Telegram WebApp...');
            
            // Проверяем наличие Telegram WebApp
            if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
                webapp = window.Telegram.WebApp;
                isTelegramWebApp = true;
                
                debugLog('Telegram WebApp найден');
                debugLog('WebApp объект', webapp);
                
                // Расширяем приложение на весь экран
                webapp.expand();
                
                // Получаем данные пользователя
                if (webapp.initDataUnsafe && webapp.initDataUnsafe.user) {
                    tgUser = webapp.initDataUnsafe.user;
                    tgId = tgUser.id;
                    
                    debugLog('Данные пользователя получены', tgUser);
                    
                    // Показываем информацию
                    document.getElementById('userInfo').style.display = 'block';
                    document.getElementById('tgIdDisplay').textContent = tgId;
                    document.getElementById('authBtn').disabled = false;
                    document.getElementById('authBtn').textContent = 'Войти через Telegram';
                    document.getElementById('status').textContent = '✅ Данные получены, нажмите кнопку';
                    document.getElementById('status').className = 'status success';
                    
                    // let avatar = document.getElementById("avatar");
                    // avatar.innerHTML = ""
                    // avatar.style.cssText = `
                    //     background-image: url('${tgUser.photo_url}');
                    //     background-size: cover; /* Fills the whole block */
                    //     background-repeat: no-repeat; 
                    //     background-position: center;
                    // `;
                    
                    // Автоматически авторизуемся
                    // setTimeout(() => authorize(), 500);
                } else {
                    debugLog('Данные пользователя отсутствуют в initDataUnsafe');
                    document.getElementById('status').textContent = '⚠️ Данные пользователя не найдены';
                    document.getElementById('status').className = 'status error';
                    document.getElementById('authBtn').disabled = true;
                    document.getElementById('authBtn').textContent = 'Ошибка';
                }
            } else {
                // Режим тестирования вне Telegram
                debugLog('Telegram WebApp не обнаружен, режим тестирования');
                isTelegramWebApp = false;
                
                // Проверяем, есть ли параметры в URL (для WebView)
                const urlParams = new URLSearchParams(window.location.search);
                const tgIdParam = urlParams.get('tg_id');
                
                if (tgIdParam) {
                    tgId = parseInt(tgIdParam);
                    debugLog('TG ID из параметров URL', tgId);
                } else {
                    tgId = 427310232; // Тестовый ID
                    debugLog('Используем тестовый ID', tgId);
                }

                // let avatar = document.getElementById("avatar");
                // avatar.innerHTML = ""
                // avatar.style.cssText = `
                //     background-image: url('https://t.me/i/userpic/320/QmCSKEv2Z0aQZyzIgX28SzVLKh0pH-Ovw3otL4VxczQ.svg');
                //     background-size: cover; /* Fills the whole block */
                //     background-repeat: no-repeat; 
                //     background-position: center;
                // `;
                
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('tgIdDisplay').textContent = tgId + ' (тестовый)';
                document.getElementById('authBtn').disabled = false;
                document.getElementById('authBtn').textContent = 'Тестовая авторизация';
                document.getElementById('status').textContent = 'ℹ️ Тестовый режим';
            }
        }

        // Функция авторизации
        async function authorize() {
            const btn = document.getElementById('authBtn');
            const statusEl = document.getElementById('status');
            const loader = document.getElementById('loader');
            
            if (!tgId) {
                statusEl.textContent = '❌ Ошибка: не удалось получить Telegram ID';
                statusEl.className = 'status error';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Авторизация...';
            loader.classList.add('active');
            statusEl.textContent = '⏳ Отправка данных...';
            statusEl.className = 'status';
            
            debugLog('Начинаем авторизацию с TG ID:', tgId);
            
            try {
                const requestBody = {
                    tg_id: tgId
                };
                
                // Добавляем дополнительные данные, если есть
                if (tgUser) {
                    requestBody.username = tgUser.username || '';
                    requestBody.first_name = tgUser.first_name || '';
                    requestBody.last_name = tgUser.last_name || '';
                    requestBody.photo_url = tgUser.photo_url || '';
                }
                
                debugLog('Отправляем запрос на /reg_tg_id', requestBody);
                
                const response = await fetch('/reg_tg_id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                debugLog('Получен ответ от сервера', data);
                
                if (response.ok && data.success) {
                    statusEl.textContent = '✅ Авторизация успешна!';
                    statusEl.className = 'status success';
                    btn.textContent = '✅ Вы вошли';
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);

                    // // Закрываем WebApp через 2 секунды
                    // if (isTelegramWebApp && webapp) {
                    //     setTimeout(() => {
                    //         webapp.close();
                    //     }, 2000);
                    // }
                } else {
                    statusEl.textContent = `❌ Ошибка: ${data.message || 'Неизвестная ошибка'}`;
                    statusEl.className = 'status error';
                    btn.disabled = false;
                    btn.textContent = isTelegramWebApp ? 'Войти через Telegram' : 'Тестовая авторизация';
                }
            } catch (error) {
                debugLog('Ошибка при авторизации:', error);
                statusEl.textContent = '❌ Ошибка соединения с сервером';
                statusEl.className = 'status error';
                btn.disabled = false;
                btn.textContent = isTelegramWebApp ? 'Войти через Telegram' : 'Тестовая авторизация';
            } finally {
                loader.classList.remove('active');
            }
        }

        // Запускаем инициализацию после загрузки страницы
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('DOM загружен');
            initTelegramApp();
        });

        // Дополнительная проверка после полной загрузки
        window.addEventListener('load', function() {
            debugLog('Страница полностью загружена');
            // Если до сих пор нет данных, пробуем еще раз
            if (!tgId) {
                debugLog('Повторная попытка инициализации');
                initTelegramApp();
            }
        });
        function delete_coockies(){
            let responce = fetch("/tg_auth_delete", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(res => res.json())
            .then(data => {
                window.location.reload();
        });
    }
    </script>
</body>
</html>
