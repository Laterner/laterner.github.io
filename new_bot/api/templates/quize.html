{% extends "base.html" %}
{% block style %} 
<style>
    .btn {
        width: 100%;
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
    <div class="wrap">
        <div class="container" id="container">
        <h1>
            {{quize.question}}
        </h1>
        {% for item in quize.answers %}
                <button class="btn" onclick="answer({{ loop.index0 }})">{{ item }}</button>
        {% endfor %}

        <h3 id="server-answer"></h3>
    </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    async function answer(ans) {
        let response = await fetch(`/api/answer?ans=${ans}` + "&player_id={{player_id}}&quize_id={{quize_id}}&secret_code={{quize.secret_code}}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json;charset=utf-8'
            }
        });

        let result = await response.json();
        console.log(result);

        if(result.ans == 1){
            document.getElementById("container").innerHTML = `
            <h1 id="server-answer">Ответ верный!</h1>
            <a href="/miniapp"><button class="btn">Вернуться</button></a>
            `

        }
        else{
            document.getElementById("server-answer").innerHTML = "Ответ неверный!"
        }
    }
</script>
{% endblock %}
