{% extends "base.html" %}
{% block content %}
<style>
    body {
        justify-content: baseline;
        text-align: left;
    }

    .user {
        color: white;
    }

    .container {
        text-align: left;
    }
</style>
<div class="container">
    <h1>
        {{quize.question}}
    </h1>
    {% for item in quize.answers %}
            <button class="btn" onclick="answer({{ loop.index0 }})">{{ item }}</button>
    {% endfor %}
</div>
<script>
    async function answer(ans) {
        let response = await fetch(`/answer?ans=${ans}` + "&player_id={{player_id}}&quize_id={{quize_id}}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json;charset=utf-8'
            }
        });

        let result = await response.json();
        console.log(result);
    }
</script>
{% endblock %}
