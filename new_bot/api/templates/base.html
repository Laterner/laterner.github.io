<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylev4.css') }}">
    {% block style %} {% endblock %}
</head>

<body>
    <div class="wrap">
        {% block content %} {% endblock %}
    </div>
    <div id="logger"></div>
</body>

<div class="menu">
    <ul>
        <li><a href="/miniapp">Главная</a></li>
        <li><a href="/map">Карта и расписание</a></li>
        <li><a href="/qr">Квиз</a></li>
        <li><a href="/faq">FAQ</a></li>
    </ul>
</div>
<script>
    const detailsList = document.querySelectorAll('details');

    detailsList.forEach((details) => {
        details.addEventListener('toggle', (e) => {
            // Проверяем, что текущий тег открылся (а не закрылся)
            if (details.open) {
                // Закрываем все остальные теги details
                detailsList.forEach((otherDetails) => {
                    if (otherDetails !== details) {
                        otherDetails.removeAttribute('open');
                    }
                });
            }
        });
    });
</script>
<footer>
    {% block scripts %} {% endblock %}
</footer>
</html>
