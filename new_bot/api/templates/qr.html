{% extends "base.html" %}
{% block style %} 
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR-сканнер</title>
<script src="{{ url_for('static', filename='qr-reader.js') }}"></script>

<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 0px;
    }
    .sub {
        color: #8892a8;
        margin-bottom: 24px;
        font-size: 1rem;
    }
    #video-container {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #0f131c;
        border-radius: 18px;
        overflow: hidden;
        border: 2px solid #2f3748;
        margin-bottom: 24px;
    }
    #video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    #scan-status {
        color: #b9c2d9;
        font-size: 0.95rem;
        margin: 12px 0 18px;
        min-height: 1.8rem;
    }
    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        margin-bottom: 10px;
    }
    .word-list {
        background: #121824;
        border-radius: 40px;
        padding: 14px 22px;
        margin-top: 22px;
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px 36px;
        border: 1px solid #2a3246;
    }
    .word-badge {
        color: #b9c6e6;
        font-size: 1.1rem;
        letter-spacing: 0.3px;
    }
    .word-badge span {
        font-weight: 700;
        color: #d6defa;
        background: #242d3f;
        padding: 4px 16px;
        border-radius: 40px;
        margin-left: 6px;
    }
    .footer {
        margin-top: 18px;
        color: #5f6a82;
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h1>📷 QR‑сканер</h1>
    <p class="sub">Распознаёт одно из трёх слов</p>

    <div id="video-container">
        <!-- сюда вставится видео с камеры -->
    </div>

    <div id="status">⚡ Наведите на QR-код</div>
    <br>
    <div class="controls" id="controls">
        <button class="btn" id="scanBtn">▶ Запустить камеру</button>
        
    </div>

    <div class="footer">Отсканируйте код и откройте квиз</div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const scanner = new Html5Qrcode("video-container");
    let started = false;

    document.getElementById("scanBtn").onclick = async () => {
        if (started) return;
        started = true;
        
        try {
            await scanner.start(
                {
                    facingMode: "environment"
                },
                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },
                async (text) => {
                    if (!/^[A-Za-z]{5}$/.test(text)) {
                        document.getElementById("status").textContent = 
                            "QR должен содержать 5 букв";
                        started = false;
                        return;
                    }

                    await scanner.stop();
                    document.getElementById("status").textContent = "Отправка...";

                    try {
                        const response = await fetch("/api/secretcode", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                secret_code: text.toUpperCase()
                            })
                        });
                        
                        const result = await response.json();
                        console.log('Result:', result);
                        
                        if (result.quize_id !== undefined) {
                            if (result.quize_id >= 0) {
                                document.getElementById("controls").innerHTML = 
                                    `<br><br><a href="/quize?quize_id=${result.quize_id}">
                                        <button class="btn">Открыть квиз #${result.quize_id + 1}</button>
                                    </a>`;
                                document.getElementById("status").textContent = 
                                    `✅ Код найден! Переходите к квизу`;
                            } else {
                                document.getElementById("status").textContent = 
                                    "❌ Неверный код! Попробуйте снова";
                                resetScanner();
                            }
                        } else {
                            document.getElementById("status").textContent = 
                                "❌ Ошибка: " + (result.error || "Неизвестная ошибка");
                            resetScanner();
                        }
                        
                    } catch (error) {
                        console.error('Fetch error:', error);
                        document.getElementById("status").textContent = 
                            "❌ Ошибка соединения";
                        resetScanner();
                    }
                    
                    started = false;
                }
            );

        } catch (e) {
            started = false;
            document.getElementById("status").textContent = 
                "Не удалось открыть камеру: " + e;
            console.error(e);
        }
    };

    function resetScanner() {
        document.getElementById("controls").innerHTML = 
            `<button class="btn" id="scanBtn">📷 Сканировать QR</button>`;
        // Перезагружаем страницу или перепривязываем обработчик  btn-primary
        location.reload(); // Простой способ, но можно и перепривязать 
    }
</script>
{% endblock %}
