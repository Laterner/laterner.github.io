<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

fetch("/tg_auth", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        initData: tg.initData
    })
})
.then(res => res.json())
.then(data => {
    document.body.innerHTML = `
        <h2>Пользователь</h2>
        <p>ID: ${data.id}</p>
        <p>Username: ${data.username}</p>
    `;
});
</script>
