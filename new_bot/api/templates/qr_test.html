<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    padding:20px;
}

#reader{
    width:320px;
    max-width:100%;
    margin:20px auto;
}

button{
    padding:12px 24px;
    font-size:18px;
}

#status{
    margin-top:20px;
}
</style>
</head>
<body>

<h2>Сканирование QR</h2>

<button id="scanBtn">Сканировать</button>

<div id="reader"></div>

<div id="status"></div>

<script>
const scanner = new Html5Qrcode("reader");
let started = false;

document.getElementById("scanBtn").onclick = async () => {

    if (started) return;

    started = true;
    
    try {

        await scanner.start(
            {
                facingMode: "environment"
            },
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            async (text) => {

                if (!/^[A-Za-z]{5}$/.test(text)) {
                    document.getElementById("status").textContent =
                        "QR должен содержать 5 букв";
                    return;
                }

                await scanner.stop();

                document.getElementById("status").textContent =
                    "Отправка...";

                const r = await fetch("/api/secretcode", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code: text.toUpperCase()
                    })
                });

                document.getElementById("status").textContent =
                    r.ok ? "Успешно!" : "Ошибка отправки";

                started = false;
            }
        );

    } catch (e) {
        started = false;
        document.getElementById("status").textContent =
            "Не удалось открыть камеру\n\n"  + `${e}`;
        console.error(e);
    }
};
</script>

</body>
</html>
