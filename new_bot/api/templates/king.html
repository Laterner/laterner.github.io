<!-- api/templates/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_admin_score.css') }}">

</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎮</div>
            <h1>Добавление очков участникам</h1>
        </div>
        
        <form id="scoreForm">
            <div class="form-group">
                <label for="playerId">🎯 Player ID</label>
                <input 
                    type="text" 
                    id="playerId" 
                    placeholder="Введите ID игрока" 
                    required
                    autocomplete="off"
                    maxlength="10"
                >
            </div>
            
            <!-- Скрытое поле для количества очков -->
            <input type="hidden" id="amount" value="0">
            
            <!-- Блок с кнопками добавления очков -->
            <button type="submit" class="button" id="submitBtn">
                Смеситить короля
            </button>
        </form>
        
        <!-- Статус игрока -->
        <div id="playerStatus" class="player-status"></div>
        
        <!-- Информация об игроке -->
        <div id="playerInfo" class="player-info">
            <h3 style="margin-bottom: 10px; color: #333;">👤 Информация об игроке</h3>
            <div class="info-item">
                <span class="info-label">Имя:</span>
                <span class="info-value" id="infoName">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Текущие очки:</span>
                <span class="info-value highlight" id="infoScore">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Команда:</span>
                <span class="info-value" id="infoTeam">-</span>
            </div>
        </div>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        const form = document.getElementById('scoreForm');
        const playerIdInput = document.getElementById('playerId');
        const amountInput = document.getElementById('amount');
        const scoreButtons = document.getElementById('scoreButtons');
        const resultDiv = document.getElementById('result');
        const playerInfoDiv = document.getElementById('playerInfo');
        const playerStatusDiv = document.getElementById('playerStatus');
        const submitBtn = document.getElementById('submitBtn');
        
        let currentPlayerId = '';
        let selectedAmount = 0;
        let isProcessing = false;
        
        // Проверка игрока при вводе
        let checkTimeout;
        playerIdInput.addEventListener('input', function() {
            clearTimeout(checkTimeout);
            const playerId = this.value.trim().toUpperCase();
            this.value = playerId;
            
            if (playerId.length >= 3) {
                checkTimeout = setTimeout(() => checkPlayer(playerId), 500);
            } else {
                hidePlayerInfo();
            }
        });
        
        
        async function checkPlayer(playerId) {
            try {
                const response = await fetch(`/api/check_player/${playerId}`);
                const data = await response.json();
                
                if (data.exists) {
                    currentPlayerId = playerId;
                    document.getElementById('infoName').textContent = data.name;
                    document.getElementById('infoScore').textContent = data.score;
                    document.getElementById('infoTeam').textContent = data.team || 'Нет команды';
                    playerInfoDiv.classList.add('visible');
                    scoreButtons.classList.add('visible');
                    
                    // Показываем статус "найден"
                    showPlayerStatus('✅ Игрок найден! Выберите количество очков', 'found');
                    
                    // Активируем кнопки
                    document.querySelectorAll('.score-btn').forEach(b => {
                        b.disabled = false;
                        b.style.opacity = '1';
                        b.style.transform = 'scale(1)';
                    });
                } else {
                    hidePlayerInfo();
                    showPlayerStatus('❌ Игрок не найден. Проверьте ID', 'not-found');
                    
                    // Деактивируем кнопки
                    document.querySelectorAll('.score-btn').forEach(b => {
                        b.disabled = true;
                        b.style.opacity = '0.5';
                    });
                }
            } catch (error) {
                console.error('Error checking player:', error);
                showPlayerStatus('❌ Ошибка при проверке игрока', 'not-found');
            }
        }





        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const playerId = playerIdInput.value.trim().toUpperCase();
            
            if (!playerId) {
                showResult('❌ Введите Player ID', 'error');
                return;
            }

            // Отключаем кнопку
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Обработка...';

            try {
                const response = await fetch('/set_player_king', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        player_id: playerId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Ответ сервера:', data);
                return data;
            } catch (error) {
                showResult('Ошибка при установке игрока:', 'error');
                console.log('Ошибка при установке игрока:', error);
                throw error;
            }

        });


        
        async function addScore(playerId, amount) {
            if (!playerId) {
                showResult('❌ Сначала найдите игрока', 'error');
                return;
            }
            
            if (!amount || amount < 1) {
                showResult('❌ Выберите количество очков', 'error');
                return;
            }
            
            isProcessing = true;
            
            // Блокируем кнопки
            document.querySelectorAll('.score-btn').forEach(b => {
                b.disabled = true;
                b.innerHTML = '<span class="spinner" style="width:16px;height:16px;"></span>';
            });
            
            try {
                const formData = new FormData();
                formData.append('player_id', playerId);
                formData.append('amount', amount);
                
                const response = await fetch('/api/add_score', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();

                const playerIdInput = document.getElementById('playerId');
                const amountInput = document.getElementById('amount');
                const scoreButtons = document.getElementById('scoreButtons');
                const resultDiv = document.getElementById('result');
                const playerInfoDiv = document.getElementById('playerInfo');
                const playerStatusDiv = document.getElementById('playerStatus');

                if (data.success) {
                    showResult(`✅ ${data.message}`, 'success');
                    // Обновляем информацию об игроке
                    if (data.player) {
                        document.getElementById('infoScore').textContent = data.player.new_score;
                        // Анимация обновления
                        const scoreElement = document.getElementById('infoScore');
                        scoreElement.style.transition = 'all 0.3s';
                        scoreElement.style.transform = 'scale(1.3)';
                        setTimeout(() => {
                            scoreElement.style.transform = 'scale(1)';
                        }, 300);
                    }
                    
                    // Сбрасываем выделение кнопок
                    document.querySelectorAll('.score-btn').forEach(b => {
                        b.style.opacity = '0';
                        b.style.transform = 'scale(1)';
                        b.disabled = true;
                    });

                    hidePlayerInfo();
                    playerIdInput.value = '';
                    
                } else {
                    showResult(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Ошибка: ${error.message}`, 'error');
            } finally {
                isProcessing = false;
                // Восстанавливаем кнопки
                document.querySelectorAll('.score-btn').forEach(b => {
                    b.disabled = false;
                    const amount = b.dataset.amount;
                    b.innerHTML = `
                        <span class="plus-icon">+${amount}</span>
                        <span>${'⭐'.repeat(amount/5)}</span>
                    `;
                });
            }
        }
        
        function showPlayerStatus(message, type) {
            playerStatusDiv.textContent = message;
            playerStatusDiv.className = 'player-status ' + type;
            playerStatusDiv.style.display = 'block';
        }
        
        function hidePlayerInfo() {
            playerInfoDiv.classList.remove('visible');
            playerStatusDiv.style.display = 'none';
            currentPlayerId = '';
        }
        
        function showResult(message, type) {
            resultDiv.textContent = message;
            resultDiv.className = 'result ' + type;
            resultDiv.style.display = 'block';
            
            // Автоматически скрываем через 5 секунд
            clearTimeout(resultDiv._timeout);
            resultDiv._timeout = setTimeout(() => {
                resultDiv.style.display = 'none';
            }, 5000);
        }
        
        // Автоматическое преобразование в верхний регистр
        playerIdInput.addEventListener('blur', function() {
            this.value = this.value.trim().toUpperCase();
        });
        
        // Обработка Enter в поле ввода
        playerIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const playerId = this.value.trim().toUpperCase();
                if (playerId.length >= 3) {
                    checkPlayer(playerId);
                }
            }
        });
        
        // Инициализация - деактивируем кнопки
        document.querySelectorAll('.score-btn').forEach(b => {
            b.disabled = true;
        });
    </script>
</body>
</html>
