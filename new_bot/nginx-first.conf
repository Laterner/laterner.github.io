# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name fstbot.ru www.fstbot.ru;   # замените на свой домен

    # Проверка для Certbot (ACME challenge)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Все остальные запросы перенаправляем на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Основной HTTPS-сервер
server {
    listen 443;
    server_name fstbot.ru www.fstbot.ru;   # замените на свой домен

    # Пути к сертификатам (внутри контейнера)
    # ssl_certificate     /etc/letsencrypt/live/fstbot.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fstbot.ru/privkey.pem;

    # Настройки SSL (рекомендованные)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Проксирование на FastAPI
    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статические файлы (если нужно отдавать напрямую через Nginx)
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }
    location /media/ {
        alias /usr/share/nginx/html/media/;
    }
}