services:
  postgres:
    image: postgres:16-alpine
    container_name: my_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  fastapi:
    build: ./api
    container_name: fastapi
    # restart: always
    env_file:
      - .env
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_healthy

  bot:
    build: ./bot
    container_name: bot
    # restart: always
    env_file:
      - .env
    volumes:
      - ./bot:/bot
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 7000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy


networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: