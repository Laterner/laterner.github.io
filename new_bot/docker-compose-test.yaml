version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: my_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app_network

  fastapi:
    build: ./api
    container_name: fastapi
    restart: always
    env_file:
      - .env
    volumes:
      - ./api:/app
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      - postgres
  
  bot:
    build: ./bot
    container_name: bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./bot:/bot
      - ./static:/app/static
      - ./media:/app/media
    networks:
      - app_network
    depends_on:
      - postgres

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: