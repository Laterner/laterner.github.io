version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: my_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  fastapi:
    build: ./api
    container_name: fastapi
    restart: always
    env_file:
      - .env
    volumes:
      - ./api:/app
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-first.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./static:/usr/share/nginx/html/static:ro
      # - ./media:/usr/share/nginx/html/media:ro
      # *** ИСПРАВЛЕНО: монтируем сертификаты в стандартную папку Let's Encrypt ***
      # - ./certs:/etc/letsencrypt:ro
      # - ./logs/nginx:/var/log/nginx
    depends_on:
      - fastapi
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: