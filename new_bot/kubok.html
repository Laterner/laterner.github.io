<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  .image-container {
    position: relative; /* Создаем контекст для позиционирования */
    display: inline-block;
    width: 100%;
    max-width: 600px;
  }
  
  .image-container img {
    width: 100%;
    height: auto;
    display: block;
  }
  
  .text-overlay {
    position: absolute; /* Абсолютное позиционирование текста */
    top: 50%;           /* Сдвигаем вниз на 50% от родителя */
    left: 50%;          /* Сдвигаем вправо на 50% от родителя */
    transform: translate(-50%, -50%); /* Центрируем текст точно по осям */
    color: white;       /* Цвет текста */
    font-size: 24px;    /* Размер шрифта */
    font-weight: bold;
    text-align: center;
    background-color: rgba(0, 0, 0, 0.5); /* Полупрозрачный фон для читаемости */
    padding: 10px 20px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="image-container">
  <img src="https://img.freepik.com/free-vector/trophy-flat-style_78370-3222.jpg" alt="Пример изображения">
  <div class="text-overlay">Текст поверх картинки</div>
</div>

</body>
</html>
