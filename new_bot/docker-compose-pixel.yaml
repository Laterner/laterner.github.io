  pixel:
    build: ./api
    container_name: pixel
    restart: always
    env_file:
      - .env
    volumes:
      - ./api:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "8000:8000"
    networks:
      - app_network
    # depends_on:
