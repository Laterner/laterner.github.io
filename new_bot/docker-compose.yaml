version: '3.8'

services:
  # bot:
  #   build: ./bot
  #   container_name: fastapi_bot
  #   restart: always
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./bot:/bot
  #     - ./user.db:/bot/user.db  # Общая БД
  #   networks:
  #     - app_network

  fastapi:
    build: ./api
    container_name: fastapi_api
    restart: always
    env_file:
      - .env
    volumes:
      - ./api:/app
      - ./static:/app/static
      - ./media:/app/media
      - ./user.db:/app/user.db  # Общая БД
    expose:
      - "8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./media:/usr/share/nginx/html/media:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - app_network

  # Certbot для SSL сертификатов
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./static:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network
    depends_on:
      - nginx

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: