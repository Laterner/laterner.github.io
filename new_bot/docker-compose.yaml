services:
  postgres:
    image: postgres:16-alpine
    container_name: my_postgres
    restart: unless-stopped
    # command: postgres -c 'listen_addresses=127.0.0.1'
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  fastapi:
    build: ./api
    container_name: fastapi
    restart: always
    env_file:
      - .env
    volumes:
      - ./api:/app
      - /app/__pycache__  # Игнорируем кэш
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: ./bot
    container_name: bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./bot:/bot
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/static:/usr/share/nginx/html/static:ro
      # - ./api/media:/usr/share/nginx/html/media:ro
      - ./certs:/etc/nginx/certs/fstbot.ru:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - fastapi
    networks:
      - app_network

  # Сервис для первоначального получения и автоматического обновления сертификатов
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./static:/var/www/certbot   # для проверки через веб-сервер
    # Вместо бесконечного цикла оставляем команду для разового получения
    # (запустите вручную или измените на цикл, если нужно)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network
    depends_on:
      - nginx
    # Не запускаем автоматически, лучше выполнить вручную первый раз
    profiles:
      - certbot   # запускать только с --profile certbot, если нужен авторежим

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: