name: Deploy Telegram Mini App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: main
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare deployment
        run: |
          # Копируем статику во временную папку
          mkdir -p deploy_temp
          cp -r static/* deploy_temp/
          # Добавляем .nojekyll, чтобы GitHub не игнорировал файлы с подчеркиванием
          touch deploy_temp/.nojekyll
          # Если хотите, чтобы index.html был в корне, создаем index.html
          # (он уже есть в static, просто копируем)
          ls -la deploy_temp/
      
      - uses: actions/configure-pages@v4
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_temp'
      
      - uses: actions/deploy-pages@v4
        id: deployment